<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeHer - Verify Account</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="otp.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="logo">
      <span class="shield-icon">🛡️</span>
      <h1>Safe<strong>Her</strong></h1>
    </div>

    <div class="auth-box">
      <span class="subtitle">VERIFY YOUR ACCOUNT</span>
      <h2>Enter verification code</h2>
      <p class="instruction">We sent a verification code to:<br>
        <strong id="emailDisplay">Loading...</strong>
      </p>

      <form id="otpForm">
        <div class="otp-container">
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required />
        </div>

        <button type="submit" id="verifyBtn" class="btn-primary">Verify &amp; Continue &rarr;</button>
      </form>

      <div class="resend-section">
        <p>Didn't receive the code?</p>
        <button type="button" id="resendBtn" class="btn-link">Resend OTP</button>
      </div>
    </div>
  </div>
</body>
</html>
